name: Bug report
description: Report unexpected behavior or an error.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Provide the details below so maintainers can reproduce the problem.
        **For security vulnerabilities, follow SECURITY.md and use a private channel with this fork's maintainer. Do not post exploit details here.**
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing issues.
          required: true
        - label: I reproduced this on an authorized target or in a local isolated environment.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
      placeholder: "Example: the results page shows untranslated text."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Open the affected page
        2. Perform the action
        3. Observe the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Include relevant logs or screenshots. Redact API keys, tokens, personal information, and private target addresses.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Select the affected component.
      options:
        - Agent
        - Web UI / server
        - Installation / deployment
        - LLM provider integration
        - Documentation / English copy
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the release tag or commit hash.
      placeholder: "Example: v2.2.0 or b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Docker usage, and model/provider where relevant.
      placeholder: "Example: macOS / Docker Compose / configured provider and model"
    validations:
      required: false
