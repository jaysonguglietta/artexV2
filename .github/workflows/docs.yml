name: docs
# Check internal Markdown file, image, and heading references on every push/PR.
# No path filter: referenced files may live anywhere in the repository.
# External links are network-dependent and checked separately on a schedule.
# This deterministic standard-library-only check requires no network access.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Cancel superseded checks on the same branch.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Isolated Python ignores user site packages and environment customizations.
      - name: Internal documentation link integrity
        run: python3 -I scripts/check-doc-links.py
