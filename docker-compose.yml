# Local single-operator deployment. Do not publish the API or proxy publicly.
x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  postgres:
    image: artex-local:postgres
    build:
      context: .
      dockerfile: Dockerfile.source
      target: postgres
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: artex
      ARTEX_PG_DISK_BYTES: ${ARTEX_PG_DISK_BYTES-8589934592}
      PGDATA: /var/lib/postgresql/bounded/data
    entrypoint: ["/usr/local/bin/artex-postgres-entrypoint"]
    command: ["postgres", "-c", "logging_collector=off", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - pgdisk:/var/lib/artex-pgdisk
    devices:
      - /dev/loop-control:/dev/loop-control
    device_cgroup_rules: ["b 7:* rwm"]
    read_only: true
    cap_drop: [ALL]
    # Trusted bootstrap only; supervisor and PostgreSQL irreversibly drop all.
    cap_add: [SYS_ADMIN, MKNOD, CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, MAC_OVERRIDE]
    # Fixed bootstrap mounts ext4, then MUST re-enter docker-default before PG.
    security_opt: ["no-new-privileges:true", "apparmor=unconfined"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70
      - /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=1m,mode=000
    pids_limit: 256
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "/usr/local/bin/artex-postgres-entrypoint", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2m
    networks: [database]
    mem_limit: 1g
    cpus: 1
    logging: *bounded-logging
    restart: unless-stopped

  artex:
    image: artex-local:development
    build:
      context: .
      dockerfile: Dockerfile.source
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_KEY_DIR: /app/private
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_LANG: en
      ARTEX_ENABLE_SELF_UPDATE: "0"
      ARTEX_INSECURE_TARGET_TLS: "0"
      ARTEX_RAW_TRANSCRIPTS: ${ARTEX_RAW_TRANSCRIPTS:-ephemeral}
      ARTEX_EVIDENCE_QUOTA_BYTES: ${ARTEX_EVIDENCE_QUOTA_BYTES-2147483648}
      ARTEX_TRAFFIC_QUOTA_BYTES: ${ARTEX_TRAFFIC_QUOTA_BYTES-5368709120}
      ARTEX_WORKSPACE_QUOTA_BYTES: ${ARTEX_WORKSPACE_QUOTA_BYTES-5368709120}
      ARTEX_EVIDENCE_QUOTA_ENTRIES: ${ARTEX_EVIDENCE_QUOTA_ENTRIES-100000}
      ARTEX_TRAFFIC_QUOTA_ENTRIES: ${ARTEX_TRAFFIC_QUOTA_ENTRIES-100000}
      ARTEX_WORKSPACE_QUOTA_ENTRIES: ${ARTEX_WORKSPACE_QUOTA_ENTRIES-100000}
      ARTEX_MAX_EVIDENCE_BODY_BYTES: ${ARTEX_MAX_EVIDENCE_BODY_BYTES-67108864}
      ARTEX_MAX_TRAFFIC_EXCHANGES: ${ARTEX_MAX_TRAFFIC_EXCHANGES-100000}
      ARTEX_WORKER_URL: ${ARTEX_WORKER_URL:-}
      ARTEX_WORKER_TOKEN_FILE: /run/secrets/worker-token
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - artifacts:/app/data
      - private:/app/private
    secrets: [worker-token]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /app/data/transcripts:rw,nosuid,nodev,noexec,size=256m,nr_inodes=8192,uid=10001,gid=10001
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2
    networks: [database, assessment, management]
    logging: *bounded-logging
    restart: unless-stopped

networks:
  database:
    internal: true
  assessment: {}
  management:
    internal: true
volumes:
  # New backing store only. The former <project>_pgdata volume is deliberately
  # absent: no automatic migration, adoption or deletion of existing data.
  pgdisk: {}
  artifacts: {}
  private: {}

secrets:
  worker-token:
    file: ./.secrets/worker-token
