# Local single-operator deployment. Do not publish the API or proxy publicly.
services:
  postgres:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [database]
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  artex:
    image: artex-local:development
    build:
      context: .
      dockerfile: Dockerfile.source
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_KEY_DIR: /app/private
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_LANG: en
      ARTEX_ENABLE_SELF_UPDATE: "0"
      ARTEX_INSECURE_TARGET_TLS: "0"
      ARTEX_WORKER_URL: ${ARTEX_WORKER_URL:-}
      ARTEX_WORKER_TOKEN_FILE: /run/secrets/worker-token
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - artifacts:/app/data
      - private:/app/private
    secrets: [worker-token]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2
    networks: [database, assessment, management]
    restart: unless-stopped

networks:
  database:
    internal: true
  assessment: {}
  management:
    internal: true
volumes:
  pgdata: {}
  artifacts: {}
  private: {}

secrets:
  worker-token:
    file: ./.secrets/worker-token
